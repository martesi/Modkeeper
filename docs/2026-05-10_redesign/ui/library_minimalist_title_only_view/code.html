<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#e91e63",
                        "primary-hover": "#d81b60",
                        "background-light": "#f0f4f9",
                        "background-dark": "#1a1a1a",
                        "surface-glass": "rgba(255, 255, 255, 0.45)",
                        "surface-glass-hover": "rgba(255, 255, 255, 0.65)",
                    },
                    fontFamily: {
                        display: ["Segoe UI", "Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "3xl": "2rem",
                    },
                    boxShadow: {
                        'fluent': '0 4px 12px rgba(0, 0, 0, 0.03), 0 0 2px rgba(0, 0, 0, 0.02)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'card-hover': '0 8px 24px -6px rgba(0, 0, 0, 0.05)',
                    },
                    borderWidth: {
                        'thin': '0.5px',
                    }
                },
            },
        };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.8) 0, transparent 70%), 
                radial-gradient(at 100% 0%, rgba(233, 30, 99, 0.03) 0, transparent 60%),
                radial-gradient(at 50% 100%, rgba(220, 230, 255, 0.3) 0, transparent 80%);
            background-attachment: fixed;
            background-color: #f3f6f9;
        }
        .mica-glass {
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        .mica-glass-strong {
             backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .custom-checkbox {
            appearance: none;
            background-color: rgba(255, 255, 255, 0.5);
            margin: 0;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 0.35rem;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .custom-checkbox:checked {
            background-color: #e91e63;
            border-color: #e91e63;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1rem 1rem white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }
        .toggle-switch:checked + .toggle-bg {
            background-color: #e91e63;
            opacity: 0.9;
        }
        .toggle-switch:checked + .toggle-bg .toggle-dot {
            transform: translateX(1.1rem);
        }::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
