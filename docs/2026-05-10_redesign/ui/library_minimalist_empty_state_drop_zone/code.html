<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Modkeeper - Minimalist Mica Cohesion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#e91e63",
                        "primary-hover": "#d81b60",
                        "background-light": "#f0f4f9",
                        "background-dark": "#1a1a1a",
                        "surface-glass": "rgba(255, 255, 255, 0.45)",
                        "surface-glass-hover": "rgba(255, 255, 255, 0.65)",
                    },
                    fontFamily: {
                        display: ["Segoe UI", "Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "3xl": "2rem",
                    },
                    boxShadow: {
                        'fluent': '0 4px 12px rgba(0, 0, 0, 0.03), 0 0 2px rgba(0, 0, 0, 0.02)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'card-hover': '0 8px 24px -6px rgba(0, 0, 0, 0.05)',
                    },
                    borderWidth: {
                        'thin': '0.5px',
                    }
                },
            },
        };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.8) 0, transparent 70%), 
                radial-gradient(at 100% 0%, rgba(233, 30, 99, 0.03) 0, transparent 60%),
                radial-gradient(at 50% 100%, rgba(220, 230, 255, 0.3) 0, transparent 80%);
            background-attachment: fixed;
            background-color: #f3f6f9;
        }
        .mica-glass {
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        .mica-glass-strong {
             backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .custom-checkbox {
            appearance: none;
            background-color: rgba(255, 255, 255, 0.5);
            margin: 0;
            width: 1.25rem;
            height: 1.25rem;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 0.35rem;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .custom-checkbox:checked {
            background-color: #e91e63;
            border-color: #e91e63;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1rem 1rem white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }
        .toggle-switch:checked + .toggle-bg {
            background-color: #e91e63;
            opacity: 0.9;
        }
        .toggle-switch:checked + .toggle-bg .toggle-dot {
            transform: translateX(1.1rem);
        }::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden selection:bg-primary/20 selection:text-primary">
<div class="h-10 w-full flex items-center justify-between px-4 select-none pt-2 z-50">
<div class="flex items-center gap-2">
<div class="text-primary font-bold text-lg tracking-tight">MK</div>
<span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Library</span>
</div>
<div class="flex items-center gap-4 text-gray-400">
<span class="material-symbols-outlined text-sm cursor-pointer hover:text-gray-800 transition-colors">remove</span>
<span class="material-symbols-outlined text-sm cursor-pointer hover:text-gray-800 transition-colors">crop_square</span>
<span class="material-symbols-outlined text-sm cursor-pointer hover:text-red-500 transition-colors">close</span>
</div>
</div>
<div class="flex-1 flex overflow-hidden">
<main class="flex-1 flex flex-col relative p-8 min-w-0">
<header class="flex items-center justify-between mb-8 w-full">
<div>
<h1 class="text-3xl font-bold text-gray-900 tracking-tight">Library</h1>
<p class="text-gray-500 mt-1 font-medium text-sm">42 Mods Installed</p>
</div>
<div class="flex items-center gap-4">
<div class="mica-glass p-1 rounded-2xl flex items-center gap-1 shadow-sm">
<button class="w-9 h-9 rounded-xl hover:bg-white/60 text-emerald-600 flex items-center justify-center transition-all relative group" title="Launch SPT Server">
<span class="material-symbols-outlined fill-[1] text-[20px]">dns</span>
<div class="absolute top-2 right-2 w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>
</button>
<button class="w-9 h-9 rounded-xl hover:bg-white/60 text-primary flex items-center justify-center transition-all" title="Launch SPT Launcher">
<span class="material-symbols-outlined fill-[1] text-[20px]">play_arrow</span>
</button>
<button class="w-9 h-9 rounded-xl hover:bg-white/60 text-blue-600 flex items-center justify-center transition-all" title="Profile Editor">
<span class="material-symbols-outlined text-[20px]">person_edit</span>
</button>
<div class="w-px h-5 bg-gray-400/20 mx-1"></div>
<button class="w-9 h-9 rounded-xl hover:bg-white/60 text-gray-600 flex items-center justify-center transition-all" title="Sync Mods">
<span class="material-symbols-outlined text-[20px]">sync</span>
</button>
<button class="w-9 h-9 rounded-xl hover:bg-white/60 text-gray-700 flex items-center justify-center transition-all" title="Add Mod">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
</div>
</header>
<div class="flex-1 flex flex-col items-center justify-center">
<div class="mica-glass w-full max-w-3xl aspect-[16/9] border-2 border-dashed border-gray-400/50 rounded-3xl flex flex-col items-center justify-center relative hover:border-primary/50 hover:bg-white/30 transition-all cursor-pointer group">
<div class="flex flex-col items-center gap-4">
<div class="w-20 h-20 rounded-full bg-primary/10 flex items-center justify-center text-primary mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-5xl">cloud_upload</span>
</div>
<div class="text-center">
<h3 class="text-xl font-bold text-gray-800">Drag and drop mod folders or zip files here to install</h3>
<p class="text-gray-500 mt-2">
                    or <span class="text-primary font-semibold hover:underline cursor-pointer">click to browse local files</span>
</p>
</div>
</div>
<div class="absolute bottom-6 right-6">
<div class="bg-white/60 backdrop-blur-md px-4 py-2 rounded-xl border border-white/50 flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined text-gray-400 text-lg">info</span>
<div class="flex flex-col">
<span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Supported Formats</span>
<span class="text-xs font-medium text-gray-600">.zip, .rar, .7z</span>
</div>
</div>
</div>
</div>
</div><div class="flex justify-center mt-6">
<nav class="mica-glass-strong rounded-full px-2 py-1.5 flex items-center gap-2 shadow-glass border border-white/50">
<button class="w-10 h-10 rounded-full text-white bg-primary shadow-lg shadow-primary/30 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[22px]">home</span>
</button>

<button class="w-10 h-10 rounded-full text-gray-500 hover:bg-white/50 hover:text-gray-900 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[22px]">settings</span>
</button>
</nav>
</div>
</main>
</div>


</body></html>
