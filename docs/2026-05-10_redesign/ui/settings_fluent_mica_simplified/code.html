<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Modkeeper - Settings</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#e91e63",
                        "primary-hover": "#d81b60",
                        "background-light": "#f0f4f9",
                        "background-dark": "#1a1a1a",
                        "surface-glass": "rgba(255, 255, 255, 0.45)",
                        "surface-glass-hover": "rgba(255, 255, 255, 0.65)",
                    },
                    fontFamily: {
                        display: ["Segoe UI", "Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "3xl": "2rem",
                    },
                    boxShadow: {
                        'fluent': '0 4px 12px rgba(0, 0, 0, 0.03), 0 0 2px rgba(0, 0, 0, 0.02)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'card-hover': '0 8px 24px -6px rgba(0, 0, 0, 0.05)',
                    },
                    borderWidth: {
                        'thin': '0.5px',
                    }
                },
            },
        };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.8) 0, transparent 70%), 
                radial-gradient(at 100% 0%, rgba(233, 30, 99, 0.03) 0, transparent 60%),
                radial-gradient(at 50% 100%, rgba(220, 230, 255, 0.3) 0, transparent 80%);
            background-attachment: fixed;
            background-color: #f3f6f9;
        }
        .mica-glass {
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }
        .mica-glass-strong {
             backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .setting-row {
            @apply flex items-center justify-between py-5 px-6 transition-colors hover:bg-white/40 border-b border-black/5 last:border-0;
        }
        .icon-box {
            @apply w-11 h-11 rounded-xl flex items-center justify-center text-gray-500 bg-white/50 border border-white/50 shadow-sm;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden selection:bg-primary/20 selection:text-primary">
<div class="h-10 w-full flex items-center justify-between px-4 select-none pt-2 z-50">
<div class="flex items-center gap-2">
<div class="text-primary font-bold text-lg tracking-tight">MK</div>
<span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Settings</span>
</div>
<div class="flex items-center gap-4 text-gray-400">
<span class="material-symbols-outlined text-sm cursor-pointer hover:text-gray-800 transition-colors">remove</span>
<span class="material-symbols-outlined text-sm cursor-pointer hover:text-gray-800 transition-colors">crop_square</span>
<span class="material-symbols-outlined text-sm cursor-pointer hover:text-red-500 transition-colors">close</span>
</div>
</div>
<div class="flex-1 flex flex-col overflow-hidden relative">
<main class="flex-1 overflow-y-auto px-8">
<div class="max-w-3xl mx-auto pt-10 pb-32">
<header class="mb-8">
<h1 class="text-3xl font-bold text-gray-900 tracking-tight">Settings</h1>
<p class="text-gray-500 mt-1 font-medium text-sm">Find and configure settings instantly.&nbsp;&nbsp;</p>
</header>
<div class="mica-glass rounded-2xl overflow-hidden shadow-glass border border-white/40">
<div class="setting-row">
<div class="flex items-center gap-5">
<div class="icon-box">
<span class="material-symbols-outlined">dark_mode</span>
</div>
<div>
<h4 class="text-sm font-bold text-gray-800">App Theme</h4>
<p class="text-xs font-medium text-gray-500">Light, dark, or system preference</p>
</div>
</div>
<div class="flex items-center gap-1 bg-black/5 p-1 rounded-xl">
<button class="px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider transition-all bg-white shadow-sm text-gray-800 rounded-md">System</button>
<button class="px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider transition-all text-gray-500 hover:text-gray-800 rounded-md">Light</button>
<button class="px-4 py-1.5 text-[10px] font-bold uppercase tracking-wider transition-all text-gray-500 hover:text-gray-800 rounded-md">Dark</button>
</div>
</div>
<div class="setting-row">
<div class="flex items-center gap-5">
<div class="icon-box">
<span class="material-symbols-outlined">palette</span>
</div>
<div>
<h4 class="text-sm font-bold text-gray-800">Accent Color</h4>
<p class="text-xs font-medium text-gray-500">Custom branding color</p>
</div>
</div>
<div class="flex items-center gap-3 pr-2">
<div class="w-6 h-6 rounded-full bg-pink-500 cursor-pointer ring-2 ring-offset-2 ring-pink-500 ring-offset-white"></div>
<div class="w-6 h-6 rounded-full bg-blue-500 cursor-pointer opacity-40 hover:opacity-100 transition-all"></div>
<div class="w-6 h-6 rounded-full bg-emerald-500 cursor-pointer opacity-40 hover:opacity-100 transition-all"></div>
<div class="w-6 h-6 rounded-full bg-orange-500 cursor-pointer opacity-40 hover:opacity-100 transition-all"></div>
</div>
</div>
<div class="setting-row">
<div class="flex items-center gap-5">
<div class="icon-box">
<span class="material-symbols-outlined">translate</span>
</div>
<div>
<h4 class="text-sm font-bold text-gray-800">Interface Language</h4>
<p class="text-xs font-medium text-gray-500">App display language</p>
</div>
</div>
<div class="relative min-w-[160px]">
<select class="w-full appearance-none bg-white/50 border-0 rounded-xl py-2 pl-4 pr-10 text-xs font-bold text-gray-700 focus:ring-2 focus:ring-primary/20 outline-none cursor-pointer">
<option>English (US)</option>
<option>Deutsch</option>
<option>Français</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-lg">expand_more</span>
</div>
</div>
</div>
</div>
</main>
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50">
<nav class="mica-glass-strong rounded-full px-2 py-1.5 flex items-center gap-2 shadow-glass border border-white/50">
<button class="w-10 h-10 rounded-full text-gray-500 hover:bg-white/50 hover:text-gray-900 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[22px]">home</span>
</button>

<button class="w-10 h-10 rounded-full text-white bg-primary shadow-lg shadow-primary/30 flex items-center justify-center transition-all">
<span class="material-symbols-outlined text-[22px]">settings</span>
</button>
</nav>
</div>
</div>








</body></html>
